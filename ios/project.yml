name: PilgiCam
options:
  bundleIdPrefix: com.pilgicam
  deploymentTarget:
    iOS: "16.0"
targets:
  PilgiCam:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 필기캠
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSCameraUsageDescription: 칠판과 슬라이드를 소리 없이 찍으려면 카메라가 필요해요.
        NSPhotoLibraryAddUsageDescription: 찍은 사진을 사진 앱에 바로 저장해요.
        UILaunchScreen:
          UIColorName: ""
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pilgicam.app
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
